name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: false
        type: string
      pilot:
        required: false
        default: false
        type: boolean

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Download with Retry
        if: ${{ !inputs.pilot }}
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: python
          command: |
            import requests
            import json
            import time

            input_data = json.loads('${{ inputs.zip_url_json }}')
            url = f"{input_data['url']}/get_zip?filename={input_data['file']}"
            
            for attempt in range(5):
                try:
                    print(f"Downloading (Attempt {attempt + 1})...")
                    r = requests.get(url, timeout=20)
                    r.raise_for_status()
                    with open('secrets.zip', 'wb') as f:
                        f.write(r.content)
                    break
                except Exception as e:
                    if attempt < 4:
                        time.sleep(5 * (2 ** attempt))
                    else: raise e

      # Public, synthetic configuration only. No real server keys, credentials,
      # signer credentials or user data are introduced in this pilot.
      - name: Create synthetic pilot configuration (no secrets)
        if: ${{ inputs.pilot }}
        shell: bash
        run: |
          python -m pip install pyzipper
          python - <<'PY'
          import base64, io, json, pyzipper
          sample = {
              'default-settings': {},
              'override-settings': {},
          }
          data = {
              'server': 'rs-ny.rustdesk.com',
              'serverPort': '21116',
              'key': '',
              'apiServer': 'https://admin.rustdesk.com',
              'custom': base64.b64encode(json.dumps(sample, separators=(',', ':')).encode()).decode(),
              'uuid': '00000000-0000-0000-0000-000000000000',
              'appname': 'rustdesk',
              'compname': 'Purslane Ltd',
              'filename': 'AdminDeskPilot',
              'iconlink_url': 'false',
              'logolink_url': 'false',
              'privacylink_url': 'false',
              'urlLink': 'https://rustdesk.com',
              'downloadLink': 'https://rustdesk.com/download',
              'delayFix': 'false',
              'xOffline': 'false',
              'removeNewVersionNotif': 'false',
              'rdgen': 'pilot',
              'themeColor': '',
              'themeSurfaceLight': '',
              'themeSurfaceDark': '',
              'themeMeColor': '',
              'update_public_key': '',
          }
          with pyzipper.AESZipFile('secrets.zip', 'w', encryption=pyzipper.WZ_AES, compression=pyzipper.ZIP_DEFLATED) as z:
              z.setpassword(b'admindesk-public-pilot-only')
              z.writestr('secrets.json', json.dumps(data))
          print('Created synthetic no-secret RDGen pilot configuration.')
          PY

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1