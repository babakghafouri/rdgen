name: AdminDesk Ads Patch Validation

on:
  push:
    branches: [admindesk-ads]
    paths:
      - '.github/patches/admindesk_ads.py'
      - '.github/patches/admindesk_server.py'
      - '.github/config/AdminDesk.json'
      - '.github/workflows/admindesk-ads-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rustdesk-1-5-0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RDGen patch
        uses: actions/checkout@v4
        with:
          path: rdgen

      - name: Validate AdminDesk server and branding configuration
        working-directory: rdgen
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('.github/config/AdminDesk.json').read_text(encoding='utf-8'))
          assert cfg['platform'] == 'windows'
          assert cfg['version'] == '1.5.0'
          assert cfg['exename'] == 'AdminDesk'
          assert cfg['serverIP'] == 'Desk.Admin98.ir'
          assert cfg['key'].strip()
          assert cfg['direction'] == 'both'
          print('AdminDesk server and branding configuration validated')
          PY

      - name: Checkout RustDesk 1.5.0
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/1.5.0
          path: rustdesk
          submodules: recursive

      - name: Apply AdminDesk server and key configuration
        run: python3 rdgen/.github/patches/admindesk_server.py --config rdgen/.github/config/AdminDesk.json --rustdesk-root rustdesk

      - name: Verify server and key were embedded
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('rdgen/.github/config/AdminDesk.json').read_text())
          source = Path('rustdesk/libs/hbb_common/src/config.rs').read_text()
          assert cfg['serverIP'] in source
          assert cfg['key'] in source
          print('AdminDesk server and key patch passed')
          PY

      - name: Apply advertising patch
        working-directory: rustdesk
        run: python3 ../rdgen/.github/patches/admindesk_ads.py

      - name: Verify Windows home placement and dependencies
        working-directory: rustdesk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          home = Path('flutter/lib/desktop/pages/desktop_home_page.dart').read_text()
          widget = Path('flutter/lib/desktop/pages/ad_banner.dart').read_text()
          pubspec = Path('flutter/pubspec.yaml').read_text()
          assert "import 'ad_banner.dart';" in home
          assert "if (isWindows && !isOutgoingOnly) const AdminDeskAdBanner()," in home
          assert home.index('buildPasswordBoard(context),') < home.index('const AdminDeskAdBanner()')
          assert "ads.admin98.ir" in widget
          assert "windows-home-sidebar" in widget
          assert "https" in widget
          assert 'http:' in pubspec
          assert 'url_launcher:' in pubspec
          print('AdminDesk ads patch smoke test passed for RustDesk 1.5.0')
          PY

      - name: Check patch is repeatable
        working-directory: rustdesk
        run: python3 ../rdgen/.github/patches/admindesk_ads.py

  validate-flutter-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout RDGen patch
        uses: actions/checkout@v4
        with:
          path: rdgen

      - name: Checkout RustDesk 1.5.0
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/1.5.0
          path: rustdesk
          submodules: recursive

      - name: Apply AdminDesk advertising patch
        working-directory: rustdesk
        run: python ../rdgen/.github/patches/admindesk_ads.py

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: rustdesk/flutter
        run: flutter pub get

      - name: Analyze AdminDesk ad widget
        working-directory: rustdesk/flutter
        run: dart analyze lib/desktop/pages/ad_banner.dart
