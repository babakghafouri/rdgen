name: AdminDesk Independent Windows Build
# Trigger a fresh build after re-enabling this workflow

on:
  workflow_dispatch:
  push:
    branches: [admindesk-ads]
    paths:
      - '.github/workflows/admindesk-windows-build.yml'
      - '.github/workflows/bridge.yml'
      - '.github/patches/**'
      - '.github/config/**'

permissions:
  contents: read

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: '1.5.0'

  build-windows:
    needs: generate-bridge
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout AdminDesk configuration and patches
        uses: actions/checkout@v4
        with:
          path: admindesk

      - name: Checkout RustDesk 1.5.0 with submodules
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/1.5.0
          submodules: recursive
          path: rustdesk

      - name: Restore generated Flutter-Rust bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: rustdesk

      - name: Check independent AdminDesk configuration
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          cfg = json.loads(Path("admindesk/.github/config/AdminDesk.json").read_text(encoding="utf-8"))
          assert cfg["exename"] == "AdminDesk"
          assert cfg["serverIP"] == "Desk.Admin98.ir"
          assert cfg["key"]
          assert cfg["platform"] == "windows"
          print("Standalone AdminDesk configuration validated")
          '@ | python -

      - name: Apply server, key and advertising patches
        shell: pwsh
        run: |
          python admindesk/.github/patches/admindesk_server.py --config admindesk/.github/config/AdminDesk.json --rustdesk-root rustdesk
          Push-Location rustdesk
          python ../admindesk/.github/patches/admindesk_ads.py
          Pop-Location

      - name: Verify AdminDesk branding inputs
        shell: pwsh
        run: |
          if (-not (Test-Path "admindesk/.github/patches/admindesk_branding.py")) { throw "Branding script missing" }
          Write-Host "Branding script found; logo injection still requires integration before release."

      - name: Prepare build dependencies
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.75'
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\\vcpkg
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          doNotCache: false

      - name: Ensure FFmpeg is a target dependency on Windows
        working-directory: rustdesk
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          p = Path("vcpkg.json")
          manifest = json.loads(p.read_text(encoding="utf-8"))
          for dependency in manifest["dependencies"]:
              if isinstance(dependency, dict) and dependency.get("name") == "ffmpeg" and dependency.get("host") is True:
                  dependency["host"] = False
                  dependency["platform"] = "windows & static"
          p.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          '@ | python -

      - name: Install vcpkg dependencies
        working-directory: rustdesk
        shell: pwsh
        run: |
          if (-not $env:VCPKG_ROOT) {
            throw "VCPKG_ROOT was not set by run-vcpkg"
          }
          if (-not (Test-Path "vcpkg.json")) {
            throw "RustDesk vcpkg.json manifest was not found in the working directory"
          }
          & "$env:VCPKG_ROOT\\vcpkg.exe" install --triplet x64-windows-static --x-install-root="$env:VCPKG_ROOT\\installed"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg dependency installation failed" }

      - name: Verify FFmpeg development headers
        shell: pwsh
        run: |
          $header = Join-Path $env:VCPKG_ROOT "installed/x64-windows-static/include/libavutil/pixfmt.h"
          if (-not (Test-Path $header)) { throw "FFmpeg header missing after vcpkg install: $header" }
          Write-Host "FFmpeg header found: $header"

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: '15.0.6'

      - name: Resolve Flutter dependencies
        working-directory: rustdesk/flutter
        run: flutter pub get

      - name: Analyze advertising widget
        working-directory: rustdesk/flutter
        run: dart analyze lib/desktop/pages/ad_banner.dart

      - name: Build Windows client
        working-directory: rustdesk
        shell: pwsh
        run: python build.py --flutter --vram

      - name: Collect packaged Windows executables
        if: success()
        shell: pwsh
        run: |
          $candidates = Get-ChildItem -Path rustdesk -Recurse -File -Include "rustdesk_portable.exe","rustdesk-*-install.exe" -ErrorAction SilentlyContinue
          $candidates | Select-Object FullName, Length | Format-Table -AutoSize
          $installer = $candidates | Where-Object { $_.Name -like "rustdesk-*-install.exe" } | Sort-Object Length -Descending | Select-Object -First 1
          $portable = $candidates | Where-Object { $_.Name -eq "rustdesk_portable.exe" } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer -and -not $portable) {
            throw "No packaged installer or portable executable found. Refusing to publish the packer tool or raw Flutter executable."
          }
          New-Item -ItemType Directory -Force -Path output | Out-Null
          $outputs = @(
            @{ File = $installer; Name = "AdminDesk-Installer.exe" }
            @{ File = $portable; Name = "AdminDesk-Portable.exe" }
          )
          foreach ($item in $outputs) {
            if (-not $item.File) { continue }
            if ($item.File.Length -lt 10MB) {
              throw "Packaged executable $($item.File.Name) is too small ($($item.File.Length) bytes)."
            }
            $signature = [System.IO.File]::ReadAllBytes($item.File.FullName)[0..1]
            if ($signature[0] -ne 0x4D -or $signature[1] -ne 0x5A) {
              throw "Packaged executable $($item.File.Name) lacks a Windows PE MZ signature."
            }
            Copy-Item $item.File.FullName (Join-Path output $item.Name)
            Write-Host "Verified $($item.Name): $($item.File.Length) bytes"
          }

      - name: Publish AdminDesk executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDesk-Windows
          path: output/AdminDesk-*.exe
          if-no-files-found: error
          retention-days: 14
